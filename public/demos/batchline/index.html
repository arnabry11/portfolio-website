<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batchline · Polytech Moulded Products</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --f-head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --bg:#EDEFEC; --panel:#F8F9F7; --panel-2:#EFF1EE; --line:#D8DCD6; --line-2:#C3C8C0;
  --ink:#22262A; --ink-2:#4A5157; --mute:#6D747A;
  --yellow:#F2B705; --yellow-edge:#D39F00; --yellow-soft:#FBF0C4;
  --side:#DFE2DD; --side-line:#CBD0C8; --side-hover:#D3D7D1;
  --link:#1D4E89;
  --ok:#276B40; --ok-bg:#DCEEDF; --warn:#8A5700; --warn-bg:#F8E7B5; --bad:#A8241C; --bad-bg:#F5D9D5; --info:#1D4E89; --info-bg:#DAE5F2;
  --stripe-dark:#22262A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --panel:#1D2023; --panel-2:#24282B; --line:#31373B; --line-2:#444C51;
    --ink:#E9EBE7; --ink-2:#B9BFBA; --mute:#8C9399;
    --yellow-soft:#3A3110; --side:#111315; --side-line:#2A2F33; --side-hover:#1B1E21;
    --link:#82B3EC; --ok:#72C690; --ok-bg:#1C3226; --warn:#EBBB4F; --warn-bg:#3A2F12; --bad:#F2918A; --bad-bg:#3D1E1B; --info:#82B3EC; --info-bg:#1A2A3E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --panel:#1D2023; --panel-2:#24282B; --line:#31373B; --line-2:#444C51;
  --ink:#E9EBE7; --ink-2:#B9BFBA; --mute:#8C9399;
  --yellow-soft:#3A3110; --side:#111315; --side-line:#2A2F33; --side-hover:#1B1E21;
  --link:#82B3EC; --ok:#72C690; --ok-bg:#1C3226; --warn:#EBBB4F; --warn-bg:#3A2F12; --bad:#F2918A; --bad-bg:#3D1E1B; --info:#82B3EC; --info-bg:#1A2A3E;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:60}
a{color:var(--link)}
h1,h2,h3{margin:0}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--stripe-dark) 12px 24px)}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100vh - 6px)}
.side{background:var(--side);border-right:1px solid var(--side-line);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - 6px - env(safe-area-inset-top,0px));overflow:auto;padding:14px 10px 18px;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 12px}
.mark{width:34px;height:34px;background:var(--yellow);color:#22262A;font:700 25px/34px var(--f-head);text-align:center;border-radius:3px}
.brand b{display:block;font:700 21px/1 var(--f-head);letter-spacing:.3px}
.brand span{font-size:12.5px;color:var(--mute)}
.grp{margin-top:10px}
.grp>span{display:block;padding:4px 10px;font:600 12.5px var(--f-body);color:var(--mute)}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:3px;color:var(--ink-2);text-decoration:none;font-weight:500;border-left:3px solid transparent}
.nv:hover{background:var(--side-hover)}
.nv.on{background:var(--panel);color:var(--ink);font-weight:600;border-left-color:var(--yellow)}
.nv .ic{flex:none;opacity:.8}
.nv .bd{margin-left:auto;background:var(--yellow);color:#22262A;font:700 11.5px var(--f-body);padding:0 6px;border-radius:9px;min-width:18px;text-align:center}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12.5px;color:var(--mute)}
.side-foot button{background:none;border:0;color:var(--link);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px}
.org{display:flex;align-items:center;gap:10px;min-width:0}
.org .av{width:34px;height:34px;border:2px solid var(--ink);border-radius:3px;display:grid;place-items:center;font:700 15px var(--f-head)}
.org b{display:block;font-weight:600;line-height:1.15}
.org small{color:var(--mute);font-size:12.5px}
.tr{display:flex;align-items:center;gap:10px}
.user{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:600 12.5px var(--f-body)}
.user b{display:block;font-weight:600;line-height:1.1;font-size:14px}
.user small{color:var(--mute);font-size:12px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:3px;cursor:pointer}
.menu-btn{display:none}
#view{padding:26px 32px 70px;max-width:1440px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font:700 38px/1.02 var(--f-head);letter-spacing:.2px}
.sub{margin:6px 0 0;color:var(--mute);max-width:62ch}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);text-decoration:none;margin-bottom:10px;font-weight:500}
.back:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:3px;font:600 14px var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--yellow);border-color:var(--yellow-edge);color:#22262A}
.btn.pri:hover{background:#FFC71F}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;background:var(--panel)}
.tabs button{border:0;background:none;color:var(--ink-2);height:36px;padding:0 16px;font:600 14px var(--f-body);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--panel)}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.pn.pad{padding:18px 20px}
.pn-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 20px 12px}
.pn h2,.pn-h h2{font:600 21px/1.1 var(--f-head);letter-spacing:.2px}
.pn.pad h2{margin-bottom:12px}
.mut{color:var(--mute);font-size:13.5px}
.stack{display:grid;gap:18px;align-content:start;min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-top:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.ticker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:6px}
.ticker.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ticker.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.ticker.c6 .tk .n{font-size:34px}
.tk{padding:15px 20px 16px;border-right:1px solid var(--line)}
.tk:last-child{border-right:0}
.tk .k{color:var(--mute);font-weight:500;font-size:14px}
.tk .n{display:block;font:600 46px/1.05 var(--f-head);margin:3px 0 1px;letter-spacing:.2px}
.tk .n small{font-size:21px;color:var(--mute);font-weight:500;margin-left:4px}
.tk .s{color:var(--ink-2);font-size:13.5px}
.tk .s.bad{color:var(--bad);font-weight:600}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font:600 13px var(--f-body);color:var(--mute);border-bottom:1px solid var(--line-2);border-top:1px solid var(--line);padding:9px 14px;background:var(--panel-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--panel-2)}
.tbl td a.id{font-weight:600;text-decoration:none}
.tbl td a.id:hover{text-decoration:underline}
.tbl .num,.tbl th.num{text-align:right}
.tbl .sm{color:var(--mute);font-size:13px;display:block}
.tbl tfoot td{font-weight:600;background:var(--panel-2);border-top:1px solid var(--line-2)}
.pill{display:inline-block;padding:1px 9px;border-radius:2px;font:600 12.5px/1.5 var(--f-body);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--panel-2);color:var(--mute);border:1px solid var(--line)}
.pill.blk{background:var(--ink);color:var(--panel)}
.toolbar{display:flex;gap:10px;padding:0 20px 14px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:190px}
label{display:grid;gap:5px;font-weight:500;font-size:13.5px;color:var(--ink-2);min-width:0}
input,select,textarea{width:100%;height:38px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:3px;padding:0 10px;font:400 15px var(--f-body)}
textarea{height:70px;padding:8px 10px;resize:vertical}
input[type=number]{text-align:right}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fg .w2{grid-column:span 2}.fg .w3{grid-column:1/-1}
.kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px}
.kv span{display:block;color:var(--mute);font-size:13px}
.kv b{font-weight:600}
.kv small{display:block;color:var(--mute)}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .t{border-top:1px solid var(--line-2);padding-top:10px;margin-top:4px;font:600 26px/1.1 var(--f-head)}
.sum .m{color:var(--mute)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;padding:13px 20px;border-top:1px solid var(--line);align-items:flex-start}
.list li:first-child{border-top:0}
.list .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--yellow);box-shadow:0 0 0 3px var(--yellow-soft)}
.list .dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.list .dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.list a{font-weight:600;text-decoration:none}
.list small{display:block;color:var(--mute)}
.bars{padding:2px 20px 18px;display:grid;gap:11px}
.vr{display:grid;grid-template-columns:150px 1fr 66px;gap:12px;align-items:center;font-size:14px}
.vt{position:relative;height:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:2px}
.vt i{position:absolute;top:0;bottom:0;background:var(--ok)}
.vt i.bad{background:var(--bad)}
.vt:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.vr .val{text-align:right;font-weight:600}
.bg{height:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden;min-width:120px}
.bg i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bg b{position:absolute;top:0;bottom:0;background:var(--yellow)}
.chart{padding:4px 12px 14px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:500 12px var(--f-body)}
.ln{fill:none;stroke:var(--ink);stroke-width:2.2}
.ref{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 4}
.dotc{fill:var(--yellow);stroke:var(--ink);stroke-width:1.6}
.gridl{stroke:var(--line);stroke-width:1}
.stk{display:flex;height:22px;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.stk i{display:block;height:100%}
.empty{padding:30px 20px;text-align:center;color:var(--mute)}
.row-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.iline{display:grid;grid-template-columns:minmax(0,2.2fr) .8fr .9fr .7fr .7fr 1fr 34px;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.iline:first-child{border-top:0}
.ltot{text-align:right;font-weight:600;padding-bottom:8px}
.steps{display:flex;gap:0;margin:0;padding:0;list-style:none;flex-wrap:wrap}
.steps li{flex:1;min-width:130px;padding:10px 14px 0 0;position:relative;color:var(--mute);font-size:13.5px}
.steps li:before{content:"";display:block;height:6px;background:var(--line-2);margin-bottom:8px}
.steps li.done{color:var(--ink)}
.steps li.done:before{background:var(--ink)}
.steps b{display:block;font-weight:600}
.mask{position:fixed;inset:0;background:rgba(14,16,18,.6);display:grid;place-items:center;padding:16px;z-index:80}
.modal{background:var(--panel);border:1px solid var(--line-2);border-top:4px solid var(--yellow);border-radius:6px;width:min(600px,100%);max-height:92vh;overflow:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 4px}
.modal-h h2{font:600 24px var(--f-head)}
.modal-b{padding:10px 20px 6px;display:grid;gap:14px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 18px;border-radius:3px;font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:opacity .18s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.warnbox{background:var(--warn-bg);color:var(--warn);padding:9px 12px;border-radius:3px;font-weight:500;font-size:14px}
.okbox{background:var(--ok-bg);color:var(--ok);padding:9px 12px;border-radius:3px;font-weight:500;font-size:14px}
.tbl tbody td.best{background:var(--yellow-soft)}
.tbl th .btn{margin-top:7px;font-weight:600}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink);cursor:pointer;padding:0}
.board{display:grid;grid-template-columns:repeat(6,minmax(182px,1fr));gap:10px;overflow-x:auto;align-items:start;padding-bottom:12px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;min-height:340px;display:flex;flex-direction:column}
.col.drop{outline:3px dashed var(--yellow-edge);outline-offset:-5px}
.col-h{padding:12px 14px 10px;border-top:4px solid var(--ink);border-radius:6px 6px 0 0;border-bottom:1px solid var(--line);background:var(--panel)}
.col-h b{font:600 20px/1.1 var(--f-head);letter-spacing:.2px}
.col-h .n{display:inline-block;margin-left:8px;min-width:22px;padding:0 7px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line-2);font:600 12.5px/20px var(--f-body);text-align:center}
.col-h small{display:block;color:var(--mute);margin-top:2px}
.cards{padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;flex:1}
.bcard{min-width:0;background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:12px 12px 10px;cursor:grab;display:grid;gap:7px}
.bcard.dragging{opacity:.45}
.bcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bcard .vol{font:600 28px/1 var(--f-head)}
.bcard .ca .btn{padding:0 10px}
.bcard .vol small{font-size:16px;color:var(--mute);font-weight:500;margin-left:3px}
.bcard .sm{display:block;color:var(--mute);font-size:13px}
.bcard .pill{white-space:normal;line-height:1.35;padding:2px 8px}
.bcard .ca{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.colend{padding:0 10px 12px}
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px}
.out{padding:22px 26px 20px}
.out .bigrow{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:6px}
.out .big{font:700 92px/.95 var(--f-head);letter-spacing:.5px}
.out .of{font:500 24px var(--f-head);color:var(--ink-2)}
.seg{display:flex;height:34px;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;margin:20px 0 12px;background:var(--panel-2)}
.seg i{display:block;height:100%;border-right:2px solid var(--panel)}
.seg i:last-child{border-right:0}
.seg.mini{height:14px;margin:0}
.lg{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13.5px;color:var(--ink-2)}
.lg .sw{margin-right:6px}
.out .fc{margin:16px 0 0;color:var(--ink-2);max-width:70ch}
.risk .rk{padding:2px 20px 8px;font:500 20px var(--f-head);color:var(--ink-2)}
.risk .rk b{font:700 54px/1 var(--f-head);color:var(--bad);margin-right:4px}
.risk .rk span{font-family:var(--f-body);font-size:14px;color:var(--mute);margin-left:8px}
.list .amt{margin-left:auto;font-weight:600;white-space:nowrap;padding-left:12px}
.ticker.c4 .tk .n{font-size:38px}
.cap{margin:-4px 20px 14px;color:var(--ink-2);font-size:14px;max-width:84ch}
.board.wboard{grid-template-columns:repeat(5,minmax(150px,1fr)) repeat(2,minmax(128px,.72fr));gap:8px}
.wcard{padding:10px 10px 9px;gap:6px}
.wcard .r1{flex-wrap:wrap;gap:4px 8px;justify-content:flex-start}
.wcard .r1 a{white-space:nowrap}
.wcard .sm a{color:var(--link)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);padding:10px 20px 4px}
@media (max-width:1080px){
  .ticker,.ticker.c4,.ticker.c6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tk{border-bottom:1px solid var(--line)}
  .g2,.two,.g3,.hero{grid-template-columns:minmax(0,1fr)}
  .out .big{font-size:72px}
  .kvs,.fg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .iline{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:270px;z-index:70;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .top{padding:0 14px}
  #view{padding:20px 14px 70px}
  .user b,.user small,.org small{display:none}
  h1{font-size:32px}
}
@media (max-width:560px){.fg,.kvs{grid-template-columns:minmax(0,1fr)}.fg .w2{grid-column:auto}.vr{grid-template-columns:110px 1fr 56px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="mark">B</div><div><b>Batchline</b><span>Manufacturing ERP</span></div></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">Prototype with sample data.<br><button data-act="reset" type="button">Reset demo data</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="org">

function poCalc(po){

function batchCalc(b){
  const r=REC(b.rid); const total=b.good+b.ret; let matExp=0,matAct=0,stdMat=0; let flagged=false;

    const vp=exp?(act/exp-1)*100:0; const flag=vp>l.tol; if(flag) flagged=true;
    matExp+=exp*it.rate; matAct+=act*it.rate; stdMat+=l.q*f*it.rate;

  });
  const conv=(r.labour+r.direct+r.ovh)/1000; const convTot=conv*total; const cost=matAct+convTot;
  const std=(stdMat+conv)/(1-r.loss/100);
  return {b,r,total,lines,matExp,matAct,convTot,cost,unit:b.good?cost/b.good:0,std,flagged,varPct:matExp?(matAct/matExp-1)*100:0};
}

  const lines=inv.lines.map(l=>{ const p=PROD(l.p); const t=l.q*l.r*(1-(l.d||0)/100); const gr=l.g==null?18:l.g; const g=t*gr/100; taxable+=t; gst+=g; return Object.assign({},l,{t,g,gr,name:p.name,hsn:p.hsn,svc:p.svc}); });

function wrMove(no,to){
  const w=WR(no); if(!w||w.stage===to) return; const from=w.stage;
  if(['Done','Rejected','Duplicate'].includes(from)){ toast('A '+from.toLowerCase()+' request cannot be moved.'); return; }
  const ok={'Requested':['Approved','Rejected','Duplicate'],'Approved':['In progress'],'In progress':['Waiting','Done'],'Waiting':['In progress']};
  if(!(ok[from]||[]).includes(to)){
    toast(from==='Requested'?'Screen it first: approve it, reject it or mark it as a duplicate.':to==='Rejected'||to==='Duplicate'?'Only requests in the inbox can be rejected or marked as duplicate.':from==='Waiting'?'Resume the work first, then mark it done.':from==='Approved'?'Start the work first.':'Requests only move forward. Use Mark waiting if the work is held up.'); return; }
  if(to==='Approved') openWrApprove(w); else if(to==='Rejected') openWrReject(w); else if(to==='Duplicate') openWrDup(w);
  else if(to==='In progress') wrStartOrResume(w); else if(to==='Waiting') openWrWait(w); else openWrDone(w);
}

/* ---- batches: board ---- */
const STAGES=['Planned','Blocked','In production','Quality check','Completed','Failed or cancelled'];
const FLOW=['Planned','In production','Quality check','Completed'];
const STAGE_COLOR={'Planned':'var(--line-2)','Blocked':'var(--ink)','In production':'var(--info)','Quality check':'var(--yellow)','Completed':'var(--ok)','Failed or cancelled':'var(--bad)'};
const NOW='2026-10-28T14:55';
/* Stock rule: materials leave stock when a batch moves INTO this stage, and return if it fails or is cancelled. */
const ISSUE_STAGE='In production';
const doneB=()=>S.batches.filter(b=>b.stage==='Completed');
const t12=s=>{ let h=+s.slice(11,13); const m=s.slice(14,16); const ap=h>=12?'pm':'am'; h=h%12||12; return h+':'+m+' '+ap; };
const mins=s=>Math.round((Date.parse(NOW+':00Z')-Date.parse(s+':00Z'))/60000);
const dur=m=>m<1?'just now':m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');
let batchView='board';
function reqMat(b){ const r=REC(b.rid); const mix=b.planned/(1-r.loss/100); return r.lines.map(l=>{ const it=ITEM(l.i); const q=l.q*mix*.001; return {l,it,qty:it.uom==='Nos'?Math.ceil(q):q}; }); }
const shortOf=b=>reqMat(b).filter(x=>x.qty>stockOf(x.it)+1e-9).map(x=>({it:x.it,by:x.qty-stockOf(x.it)}));
const bBtn=(act,no,label,cls,dis)=>'<button class="btn sm '+(cls||'')+'" data-act="'+act+'" data-no="'+no+'" type="button"'+(dis?' disabled title="Not enough stock to start this batch"':'')+'>'+label+'</button>';
function bCard(b){
  const r=REC(b.rid), st=b.stage; const vol=st==='Completed'?b.good:b.planned; let info='',btns='';
  if(st==='Planned'){ const sh=shortOf(b); info=sh.length?'<span class="pill bad">Short of '+sh.map(x=>x.it.name+' by '+n2(x.by)+' '+x.it.uom).join(', ')+'</span><span class="sm">Cannot start until stock arrives</span>':'<span class="mut">Materials available</span>'; btns=bBtn('bStart',b.no,'Start production','pri',sh.length>0)+bBtn('bBlock',b.no,'Block',sh.length?'':'ghost')+bBtn('bFail',b.no,'Cancel','ghost danger'); }
  else if(st==='Blocked'){ info='<b>'+esc(b.blockReason)+'</b><span class="sm">Blocked for '+dur(mins(b.since))+' · was '+b.prev.toLowerCase()+'</span><span class="sm">'+(b.act?'Materials stay issued':'Nothing issued yet')+'</span>'; btns=bBtn('bResume',b.no,'Resume','pri')+bBtn('bFail',b.no,b.act?'Fail':'Cancel','ghost danger'); }
  else if(st==='In production'){ info='<span class="mut">Materials issued · running '+dur(mins(b.since))+'</span>'; btns=bBtn('bQC',b.no,'Send to quality check','pri')+bBtn('bBlock',b.no,'Block','ghost')+bBtn('bFail',b.no,'Fail','ghost danger'); }
  else if(st==='Quality check'){ const m=mins(b.since); info=m>120?'<span class="pill warn">Waiting for lab '+dur(m)+'</span>':'<span class="mut">Waiting for lab '+dur(m)+'</span>'; btns=bBtn('bComplete',b.no,'Complete batch','pri')+bBtn('bBlock',b.no,'Block','ghost')+bBtn('bFail',b.no,'Fail','ghost danger'); }
  else if(st==='Completed'){ const c=batchCalc(b); info='<span class="mut">'+inr(c.unit,2)+' per bottle</span> '+(c.flagged?pill('Flagged'):''); }
  else info='<span class="mut">'+esc(b.reason)+'</span><span class="sm">Materials returned to stock</span>';
  return '<div class="bcard" draggable="'+(['Completed','Failed or cancelled'].includes(st)?'false':'true')+'" data-no="'+b.no+'"><div class="r1"><a class="id" href="#/production/batches/'+b.no+'" style="font-weight:600;text-decoration:none">'+DOC.bt(b.no)+'</a>'+pill(r.grade)+'</div><div class="vol">'+n2(vol)+'<small>bottles</small></div><div><span style="font-weight:500">'+r.name+'</span><span class="sm">'+SHIFT[b.shift]+'</span></div><div>'+info+'</div>'+(btns?'<div class="ca">'+btns+'</div>':'')+'</div>';
}
function board(){
  const cols=STAGES.map(st=>{
    let bs=S.batches.filter(b=>b.stage===st); if(st==='Completed'||st==='Failed or cancelled') bs=bs.filter(b=>b.date===TODAY);
    bs.sort((a,b)=>st==='Planned'?a.no-b.no:b.no-a.no); const vol=sum(bs,b=>st==='Completed'?b.good:b.planned);
    const sub={'Planned':'Nothing leaves stock yet','Blocked':'On hold · stock stays as it is','In production':'Materials issued from stock','Quality check':'Leak, weight and drop tests','Completed':'Today only','Failed or cancelled':'Materials returned · today'}[st];
    return '<section class="col" data-stage="'+st+'" aria-label="'+st+'"><div class="col-h" style="border-top-color:'+STAGE_COLOR[st]+'"><b>'+st+'</b><span class="n">'+bs.length+'</span><small>'+(bs.length?n2(vol)+' bottles · ':'')+sub+'</small></div><div class="cards">'+(bs.map(bCard).join('')||'<div class="empty" style="padding:22px 6px">'+(st==='Planned'?'No batches planned.':st==='Blocked'?'Nothing is blocked.':'Drop a batch here.')+'</div>')+'</div>'+(st==='Planned'?'<div class="colend"><a class="btn sm" href="#/production/batches/new" style="width:100%;justify-content:center">'+I('plus',15)+'Plan a batch</a></div>':'')+'</section>';
  }).join('');
  return '<div class="board">'+cols+'</div>';
}
function batchList(){

    return '<tr><td><a class="id" href="#/production/batches/'+b.no+'">'+DOC.bt(b.no)+'</a></td><td>'+dmy(b.date)+'</td><td>'+SHIFT[b.shift]+'</td><td>'+REC(b.rid).name+'</td><td>'+pill(b.stage)+'</td><td class="num">'+n2(done?b.good:b.planned)+'</td><td class="num">'+(done?n2(b.ret):'—')+'</td><td class="num">'+(done?inr(c.unit,2):'—')+'</td><td>'+(done?(c.flagged?pill('Flagged'):pill('Within tolerance')):'—')+'</td></tr>'; }).join('');

  else { const m=st==='Failed or cancelled'?b.returned:b.act; cols=['Material',[st==='Failed or cancelled'?'Returned to stock':'Issued from stock'],['Value']]; rows=Object.keys(m||{}).map(i=>{ const it=ITEM(i); return '<tr><td><b>'+it.name+'</b></td><td class="num">'+n2(m[i])+' '+it.uom+'</td><td class="num">'+inr(m[i]*it.rate,0)+'</td></tr>'; }).join('')||'<tr><td colspan="3"><div class="empty">Nothing had left stock for this batch.</div></td></tr>'; }
  const banner=st==='Failed or cancelled'?'<p class="warnbox" style="margin:0 0 18px">'+esc(b.reason)+(b.note?' · '+esc(b.note):'')+'</p>':st==='Blocked'?'<p class="warnbox" style="margin:0 0 18px"><b>Blocked for '+dur(mins(b.since))+':</b> '+esc(b.blockReason)+(b.blockNote?' · '+esc(b.blockNote.replace(/\.$/,'')):'')+'. '+(b.act?'The materials stay issued until you resume or fail the batch.':'Nothing has left stock for this batch.')+'</p>':st==='Quality check'&&mins(b.since)>120?'<p class="warnbox" style="margin:0 0 18px">This batch has waited for the lab for '+dur(mins(b.since))+'. Check the leak-test and weight results.</p>':'';
  return ph(DOC.bt(b.no),r.name+' · '+SHIFT[b.shift]+' · '+dmy(b.date),acts,['#/production/batches','Back to batches'])+banner
   +'<div class="two"><div class="stack"><section class="pn pad"><h2>Progress</h2>'+steps+'</section><section class="pn"><div class="pn-h"><h2>'+(needs?'Materials needed':st==='Failed or cancelled'?'Materials returned':'Materials issued')+'</h2></div>'+tbl(cols,[rows])+'</section></div>'
   +'<section class="pn pad"><h2>Batch</h2><div class="kvs" style="grid-template-columns:1fr 1fr">'+kv('Stage',pill(st))+kv('Planned output',n2(b.planned)+' bottles')+kv('Recipe',r.grade,'Weight '+r.wt+' ± '+r.wtTol+' g')+kv('Planned by',b.by)+'</div></section></div>';

function moveBatch(no,to){
  const b=S.batches.find(x=>x.no===+no); if(!b||b.stage===to) return; const from=b.stage;
  if(from==='Completed'||from==='Failed or cancelled'){ toast('A '+from.toLowerCase()+' batch cannot be moved.'); return; }
  if(from==='Blocked'){ if(to==='Failed or cancelled') openFail(b); else if(to===b.prev) resumeBatch(b); else toast('This batch was '+b.prev.toLowerCase()+' when it was blocked. Resume it there, or fail or cancel it.'); return; }
  if(to==='Blocked'){ openBlock(b); return; }
  const ok={'Planned':['In production','Failed or cancelled'],'In production':['Quality check','Failed or cancelled'],'Quality check':['Completed','Failed or cancelled']};
  if(!(ok[from]||[]).includes(to)){
    toast(FLOW.indexOf(to)>=0&&FLOW.indexOf(to)<FLOW.indexOf(from)?'Batches only move forward. To undo a started batch, fail or cancel it so the materials return to stock.':'A batch cannot skip a stage. Move it to '+FLOW[FLOW.indexOf(from)+1]+' first.'); return; }
  if(to==='In production') openStart(b); else if(to==='Quality check') toQC(b); else if(to==='Completed') openComplete(b); else openFail(b);
}
function resumeBatch(b){ const to=b.prev; setStage(b,to); delete b.blockReason; delete b.blockNote; toast(DOC.bt(b.no)+' resumed · back in '+to); render(); }

function cmRecalc(){
  const total=(+$('#cm-good').value||0)+(+$('#cm-ret').value||0); let over=[],short=[];
  $$('#cm-mat tbody tr').forEach(tr=>{ const it=ITEM(tr.dataset.i); const exp=+tr.dataset.q*total; const act=+$('input',tr).value||0; const vp=exp?(act/exp-1)*100:0; const iss=+tr.dataset.iss; const tol=+tr.dataset.tol;
    $('.e',tr).textContent=n2(exp)+' '+it.uom; const v=$('.v',tr); v.textContent=(vp>=0?'+':'')+nf(vp,1)+'%'; v.style.color=vp>tol?'var(--bad)':'inherit'; v.style.fontWeight=vp>tol?'600':'400';
    if(vp>tol) over.push(it.name); if(act-iss>stockOf(it)+1e-9) short.push(it.name); });
  $('#cm-note').innerHTML=short.length?'<p class="warnbox" style="margin:0">Not enough stock to cover the extra '+short.join(', ')+'.</p>':over.length?'<p class="warnbox" style="margin:0">Over tolerance: '+over.join(', ')+'. The batch will be flagged for review.</p>':'<p class="okbox" style="margin:0">All materials are within tolerance.</p>';

}

function pgCost(){
  const all=doneB().map(batchCalc); const sel=window.__costBatch&&all.find(c=>c.b.no===window.__costBatch)||all.filter(x=>x.b.good>=6000).pop(); const c=sel;
  const cat=[['HDPE resin',['hdpe'],'#22262A'],['Masterbatch and additives',['tio2','blk','uv'],'#B8BDB4'],['Cartons',['carton'],'#F2B705']];
  const parts=cat.map(([n,ids,col])=>({n,col,act:sum(c.lines.filter(x=>ids.includes(x.it.id)),x=>x.cost),std:sum(c.lines.filter(x=>ids.includes(x.it.id)),x=>x.expCost)}));
  parts.push({n:'Labour',col:'#1D4E89',act:c.r.labour*c.total/1000,std:c.r.labour*c.total/1000},{n:'Power and utilities',col:'#A8241C',act:c.r.direct*c.total/1000,std:c.r.direct*c.total/1000},{n:'Overhead',col:'#8A5700',act:c.r.ovh*c.total/1000,std:c.r.ovh*c.total/1000});
  const tot=sum(parts,p=>p.act), totS=sum(parts,p=>p.std);
  const opts=all.slice().reverse().map(x=>'<option value="'+x.b.no+'"'+(x.b.no===c.b.no?' selected':'')+'>'+DOC.bt(x.b.no)+' · '+x.r.grade+' · '+dmy(x.b.date)+'</option>').join('');
  const stk=parts.map(p=>'<i style="width:'+(p.act/tot*100).toFixed(2)+'%;background:'+p.col+'" title="'+p.n+'"></i>').join('');
  const prow=parts.map(p=>'<tr><td><span class="sw" style="background:'+p.col+'"></span>'+p.n+'</td><td class="num">'+inr(p.act,0)+'</td><td class="num">'+inr(p.std,0)+'</td><td class="num">'+nf(p.act/tot*100,1)+'%</td><td class="num">'+inr(p.act/c.b.good,2)+'</td></tr>').join('');
  const m={}; all.forEach(x=>{ const a=m[x.r.id]||(m[x.r.id]={r:x.r,v:0,cost:0}); a.v+=x.b.good; a.cost+=x.cost; });
  const mrows=Object.values(m).map(a=>{ const u=a.cost/a.v; const mg=a.r.price-u; return '<tr><td><b>'+a.r.name+'</b></td><td class="num">'+n2(a.v)+'</td><td class="num">'+inr(a.r.price,2)+'</td><td class="num">'+inr(u,2)+'</td><td class="num">'+inr(mg,2)+'</td><td class="num">'+nf(mg/a.r.price*100,1)+'%</td><td class="num">'+inr(mg*a.v,0)+'</td></tr>'; }).join('');
  return ph('Costing and margin','What each batch cost, what each product earns, and where the overheads went.')
   +'<section class="pn"><div class="pn-h"><h2>Batch cost breakdown</h2><label style="min-width:260px">Batch<select id="cost-sel">'+opts+'</select></label></div><p class="cap">Standard is what the recipe says this output should cost. Per good bottle includes the cost of rejects, so more rejects mean a dearer bottle.</p><div style="padding:0 20px 14px"><div class="stk" role="img" aria-label="Cost split">'+stk+'</div></div>'+tbl(['Cost',['Actual'],['Standard'],['Share'],['Per good bottle']],[prow],'<tfoot><tr><td>Total · '+n2(c.b.good)+' good bottles</td><td class="num">'+inr(tot,0)+'</td><td class="num">'+inr(totS,0)+'</td><td class="num">100%</td><td class="num">'+inr(tot/c.b.good,2)+'</td></tr></tfoot>')+'</section>'
   +'<section class="pn" style="margin-top:18px"><div class="pn-h"><h2>Margin by product</h2><span class="mut">Last 7 days</span></div><p class="cap">List price minus the cost per bottle from recent batches. It uses the list price, not each invoice. Margin earned shows which products bring in the money.</p>'+tbl(['Product',['Bottles'],['List price'],['Cost per bottle'],['Margin per bottle'],['Margin'],['Margin earned']],[mrows])+'</section>';
}

function pgStock(){
  const rows=[]; S.items.forEach(it=>{ const low=stockOf(it)<it.reorder; const bl=it.brands||[{n:'—',c:'',q:it.stock}];
    bl.forEach((b,k)=>rows.push('<tr><td>'+(k===0?'<b>'+it.name+'</b><span class="sm">'+it.sku+'</span>':'')+'</td><td>'+(b.n==='—'?'—':b.n+' · '+b.c)+'</td><td>'+it.uom+'</td><td class="num">'+n2(b.q)+'</td><td class="num">'+(k===0?n2(it.reorder):'')+'</td><td>'+(k===0?(low?pill('Low stock'):pill('In stock')):'')+'</td></tr>')); });
  return ph('Stock summary','Latest on-hand balances by item and brand catalogue. Balances update after goods receipts, batches and adjustments.','<a class="btn" href="#/stocks/low-stock">Low stock</a>')+'<section class="pn">'+tbl(['Item','Brand and catalogue no','UOM',['Balance'],['Reorder level'],'Status'],[rows.join('')])+'</section>';
}
function pgLow(){
  const low=lowStock(); const rows=low.map(it=>'<tr><td><b>'+it.name+'</b><span class="sm">'+it.sku+'</span></td><td class="num">'+n2(stockOf(it))+' '+it.uom+'</td><td class="num">'+n2(it.reorder)+' '+it.uom+'</td><td class="num">'+n2(it.reorder*2-stockOf(it))+' '+it.uom+'</td><td><button class="btn sm pri" data-act="prNew" data-item="'+it.id+'" type="button">Raise purchase request</button></td></tr>').join('');
  return ph('Low stock','Items at or below their reorder level.')+'<section class="pn">'+(low.length?tbl(['Item',['On hand'],['Reorder level'],['Suggested order'],''],[rows]):'<div class="empty"><b>Stock is healthy</b><br>Every item is above its reorder level.</div>')+'</section>';
}
function pgCash(){
  const rows=S.acc.map(a=>'<tr><td><b>'+a.name+'</b></td><td>'+a.type+'</td><td class="num">'+inr(a.bal)+'</td></tr>').join('');
  return ph('Cash and bank accounts','Where money is held. Balances update as payments are recorded.')+'<section class="pn">'+tbl(['Account','Type',['Balance']],[rows],'<tfoot><tr><td>Total</td><td></td><td class="num">'+inr(sum(S.acc,a=>a.bal))+'</td></tr></tfoot>')+'</section>';
}

 wrDoneDo(){ const w=WR($('#wn-no').value); w.doneNote=$('#wn-n').value; wrSet(w,'Done'); closeModal(); toast(DOC_WR(w.no)+' done · '+w.machine); render(); },
 bBlock(el){ openBlock(S.batches.find(b=>b.no===+el.dataset.no)); },
 bBlockDo(){ const b=S.batches.find(x=>x.no===+$('#bl-no').value); b.prev=b.stage; b.blockReason=$('#bl-r').value; b.blockNote=$('#bl-n').value; setStage(b,'Blocked'); closeModal(); toast(DOC.bt(b.no)+' blocked · '+b.blockReason); render(); },
 bResume(el){ resumeBatch(S.batches.find(b=>b.no===+el.dataset.no)); },
 bFail(el){ openFail(S.batches.find(b=>b.no===+el.dataset.no)); },
 bFailDo(){
  const b=S.batches.find(x=>x.no===+$('#fl-no').value); const had=!!b.act;
  if(b.act){ Object.keys(b.act).forEach(i=>addStock(ITEM(i),b.act[i])); b.returned=b.act; delete b.act; } else b.returned={};
  b.reason=$('#fl-r').value; b.note=$('#fl-n').value; setStage(b,'Failed or cancelled'); closeModal(); toast(DOC.bt(b.no)+(had?' failed · materials returned to stock':' cancelled')); render(); },
 invAdd(){ $('#ilines').insertAdjacentHTML('beforeend',invLine({p:'b500',q:10000,r:6.40,d:0,g:18})); invRecalc(); },
 invDel(el){ if($$('#ilines .iline').length>1){ el.closest('.iline').remove(); invRecalc(); } else toast('An invoice needs at least one line'); },
 invSave(){
  const lines=$$('#ilines .iline').map(row=>({p:$('[data-f=p]',row).value,q:+$('[data-f=q]',row).value||0,r:+$('[data-f=r]',row).value||0,d:+$('[data-f=d]',row).value||0,g:+$('[data-f=g]',row).value})).filter(l=>l.q>0);
  if(!lines.length){ toast('Add a quantity to at least one line'); return; }
  const no=Math.max(...S.inv.map(i=>i.no))+2; S.inv.push({no,date:$('#if-date').value,c:$('#if-c').value,lines,freight:+$('#if-fc').value||0,pay:[]});
  toast(DOC.si(no)+' saved · added to '+CUS($('#if-c').value).name+'’s dues'); go('/sales/invoices/'+no); },
 payOpen(el){
  const inv=S.inv.find(x=>x.no===+el.dataset.no); const x=invCalc(inv);
  openModal('Record receipt for '+DOC.si(inv.no),'<div class="fg"><label>Amount (₹)<input type="number" id="pay-a" value="'+x.due.toFixed(2)+'" min="1" step="0.01"></label><label>Date<input type="date" id="pay-d" value="'+TODAY+'"></label><label>Mode<select id="pay-m"><option>NEFT</option><option>RTGS</option><option>UPI</option><option>Cheque</option><option>Cash</option></select></label><label class="w2">Reference<input id="pay-r" placeholder="UTR or cheque number"></label><label>Deposit to<select id="pay-acc">'+S.acc.map(a=>'<option value="'+a.id+'">'+a.name+'</option>').join('')+'</select></label></div><p class="mut" style="margin:0">'+x.c.name+' owes '+inr(x.due)+' on this invoice.</p><input type="hidden" id="pay-i" value="'+inv.no+'">','<button class="btn" data-act="closeModal" type="button">Cancel</button><button class="btn pri" data-act="paySave" type="button">Save receipt</button>');
 },
 paySave(){
  const inv=S.inv.find(x=>x.no===+$('#pay-i').value); const x=invCalc(inv); const amt=Math.min(+$('#pay-a').value||0,x.due);
  if(amt<=0){ toast('Enter the amount received'); return; }
  const acc=$('#pay-acc').value; inv.pay.push({date:$('#pay-d').value,amt:+amt.toFixed(2),mode:$('#pay-m').value,ref:$('#pay-r').value||'—',acc}); S.acc.find(a=>a.id===acc).bal+=amt;
  closeModal(); toast(inr(amt,0)+' received against '+DOC.si(inv.no)); render(); }
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; e.preventDefault(); const fn=A[el.dataset.act]; if(fn) fn(el,e); });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-filter]')){ const q=t.value.toLowerCase(); $$(t.dataset.filter+' tbody tr').forEach(tr=>{ tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'; }); }
  else if(t.matches('[data-filter-status]')){ const q=t.value; $$(t.dataset.filterStatus+' tbody tr').forEach(tr=>{ tr.style.display=!q||tr.dataset.st===q?'':'none'; }); }
  else if(t.id==='bf-rec'||t.id==='bf-good') batchRebuild();
  else if(t.closest&&t.closest('#cm')) cmRecalc();
  else if(t.closest&&t.closest('#iform')){
    if(t.id==='if-c'||t.id==='if-date'){ const c=CUS($('#if-c').value); $('#if-due').value=addDays($('#if-date').value,c.credit); }
    if(t.dataset&&t.dataset.f==='p'){ const row=t.closest('.iline'); const p=PROD(t.value); $('[data-f=r]',row).value=p.price; }
    invRecalc();
  }
  else if(t.id==='pr-i'){ $('#pr-bc').value=budgetFor(t.value); $('#pr-cc').value=DEFAULT_CC[t.value]; }
  else if(t.id==='po-bc'||t.id==='po-q'||t.id==='po-r') poRem();
  else if(t.id==='cost-sel'){ window.__costBatch=+t.value; render(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ================= board drag and drop ================= */
let dragNo=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.bcard[data-no]'); if(!c) return; dragNo=+c.dataset.no; c.classList.add('dragging'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',String(dragNo)); }catch(_){} } });
document.addEventListener('dragend',()=>{ dragNo=null; $$('.bcard.dragging').forEach(x=>x.classList.remove('dragging')); $$('.col.drop').forEach(x=>x.classList.remove('drop')); });
document.addEventListener('dragover',e=>{ const col=e.target.closest&&e.target.closest('.col[data-stage]'); if(col&&dragNo!=null){ e.preventDefault(); $$('.col.drop').forEach(x=>{ if(x!==col) x.classList.remove('drop'); }); col.classList.add('drop'); } });
document.addEventListener('drop',e=>{ const col=e.target.closest&&e.target.closest('.col[data-stage]'); if(!col||dragNo==null) return; e.preventDefault(); const n=dragNo; dragNo=null; col.classList.remove('drop'); moveBatch(n,col.dataset.stage); });

/* ================= work request drag and drop ================= */
let dragWr=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.wcard[data-wr]'); if(!c) return; dragWr=+c.dataset.wr; c.classList.add('dragging'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain','wr'+dragWr); }catch(_){} } });
document.addEventListener('dragend',()=>{ dragWr=null; $$('.wcard.dragging').forEach(x=>x.classList.remove('dragging')); $$('.wcol.drop').forEach(x=>x.classList.remove('drop')); });
document.addEventListener('dragover',e=>{ const col=e.target.closest&&e.target.closest('.wcol[data-wstage]'); if(col&&dragWr!=null){ e.preventDefault(); $$('.wcol.drop').forEach(x=>{ if(x!==col) x.classList.remove('drop'); }); col.classList.add('drop'); } });
document.addEventListener('drop',e=>{ const col=e.target.closest&&e.target.closest('.wcol[data-wstage]'); if(!col||dragWr==null) return; e.preventDefault(); const n=dragWr; dragWr=null; col.classList.remove('drop'); wrMove(n,col.dataset.wstage); });

/* ================= router ================= */
const routes=[
 [/^\/$/,dashboard],[/^\/master\/items$/,pgItems],[/^\/master\/vendors$/,pgVendors],[/^\/master\/cost-centers$/,pgCC],[/^\/budget\/categories$/,pgBudget],
 [/^\/procurement\/purchase-requests$/,pgPR],[/^\/procurement\/quotation-requests$/,pgQR],[/^\/procurement\/quotation-requests\/new$/,pgQRNew],[/^\/procurement\/quotation-requests\/(\d+)$/,pgQRd],[/^\/procurement\/purchase-orders$/,pgPO],[/^\/procurement\/purchase-orders\/(\d+)$/,pgPOd],[/^\/procurement\/goods-receipts$/,pgGRN],[/^\/procurement\/approvals$/,pgAppr],
 [/^\/production\/recipes$/,pgRec],[/^\/production\/recipes\/(\w+)$/,pgRecd],[/^\/production\/batches$/,pgBatches],[/^\/production\/batches\/new$/,pgBatchNew],[/^\/production\/batches\/(\d+)$/,pgBatchd],[/^\/production\/work-requests$/,pgWR],[/^\/production\/variance$/,pgVar],
 [/^\/sales\/customers$/,pgCust],[/^\/sales\/invoices$/,pgInv],[/^\/sales\/invoices\/new$/,pgInvNew],[/^\/sales\/invoices\/(\d+)$/,pgInvd],[/^\/sales\/receipts$/,pgRcpt],[/^\/sales\/dues$/,pgDues],
 [/^\/costing$/,pgCost],[/^\/stocks\/summary$/,pgStock],[/^\/stocks\/low-stock$/,pgLow],[/^\/accounts\/cash-bank$/,pgCash]
];
function render(){
  const path=(location.hash.slice(1)||'/'); let out=null;
  for(const [re,fn] of routes){ const m=path.match(re); if(m){ out=fn.apply(null,m.slice(1)); break; } }
  if(out==null) out=nf404();
  $('#view').innerHTML=out; renderNav(path); $('#side').classList.remove('open');
  if(path==='/production/batches/new') batchRebuild();
  if(path==='/sales/invoices/new'){ $('#if-due').value=addDays($('#if-date').value,CUS($('#if-c').value).credit); invRecalc(); }
}
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });
seed(); render();
window.__proto={render,S:()=>S,routes,moveBatch,wrMove};
})();
</script>
