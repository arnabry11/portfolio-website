server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS ends at Cloudflare; relative redirects keep the visitor's https scheme.
  absolute_redirect off;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Astro fingerprints these filenames, so a changed file gets a new URL.
  location ^~ /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2|pdf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
}
