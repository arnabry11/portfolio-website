server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS ends at Cloudflare; relative redirects keep the visitor's https scheme.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

  # Locations below add Cache-Control; merge keeps these headers alongside it.
  add_header_inherit merge;
  # Cloudflare injects inline scripts (bot detection, email decoding), so
  # script-src must allow them.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Astro fingerprints these filenames, so a changed file gets a new URL.
  location ^~ /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2|pdf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
}
